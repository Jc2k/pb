[package]
name = "pb"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.8.6", features = ["json"] }
clap = { version = "4.5.8", features = ["derive"] }
dirs = "5.0.1"
encoding_rs = "0.8.35"
base64 = "0.22.1"
futures = "0.3.30"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
getrandom = "0.2.17"
ignore = "0.4.26"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
indicatif = "0.17.11"
libc = "0.2.186"
llama-cpp-2 = { version = "0.1.146", features = ["mtmd"] }
mime_guess = "2.0.5"
memmap2 = "0.9.10"
minijinja = { version = "=2.12.0", default-features = false, features = ["adjacent_loop_items", "builtins", "json", "macros", "multi_template", "serde", "std_collections"] }
regex = "1.12.4"
reqwest = { version = "0.12.5", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rust-embed = "8.9.0"
self_update = { version = "0.41.0", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.10.1"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.18"
tokenizers = "0.22"
tokio = { version = "1.38.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
toml = "0.8"
tracing = "0.1.44"
url = "2.5.8"
walkdir = "2.5.0"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
macpow = { path = "vendor/macpow" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSEnumerator",
    "NSString",
] }
objc2-open-directory = { version = "0.3", features = [
    "CFOpenDirectory",
    "CFOpenDirectoryConstants",
    "ODNode",
    "ODRecord",
    "ODSession",
] }

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
