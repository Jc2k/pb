[package]
name = "pb"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.8.6", features = ["json"] }
clap = { version = "4.5.8", features = ["derive"] }
dirs = "5.0.1"
encoding_rs = "0.8.35"
futures = "0.3.30"
llama-cpp-2 = "0.1.146"
mime_guess = "2.0.5"
regex = "1.12.4"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-embed = "8.9.0"
self_update = { version = "0.41.0", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.150"
similar = "2.7.0"
tokio = { version = "1.38.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
