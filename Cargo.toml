[package]
name = "pb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.8", features = ["derive"] }
dirs = "5.0.1"
futures = "0.3.30"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls", "stream"] }
self_update = { version = "0.41.0", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
serde = { version = "1.0.203", features = ["derive"] }
tokio = { version = "1.38.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
