name: ci-release

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Build web UI assets
        run: deno task build:web

      - name: Run web UI tests
        run: deno task test:web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release
        env:
          PB_GITHUB_CLIENT_ID: ${{ secrets.PB_GITHUB_CLIENT_ID }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache mdBook
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.5.3

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Build and test documentation
        run: deno task test:docs

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  semantic-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-test
      - docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs:
      - docs
      - semantic-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release-macos-arm64:
    needs: semantic-release
    if: needs['semantic-release'].outputs.new_release_published == 'true'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Build web UI assets
        run: deno task build:web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Update version in Cargo.toml
        run: |
          sed -i '' "s/^version = \".*\"/version = \"${{ needs['semantic-release'].outputs.new_release_version }}\"/" Cargo.toml

      - name: Build optimized macOS arm64 binary
        run: cargo build --release --target aarch64-apple-darwin
        env:
          PB_GITHUB_CLIENT_ID: ${{ secrets.PB_GITHUB_CLIENT_ID }}

      - name: Configure macOS code signing identity
        env:
          MACOS_CODESIGN_CERT_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERT_P12_BASE64 }}
          MACOS_CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_PASSWORD }}
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -n "${MACOS_CODESIGN_CERT_P12_BASE64}" ]]; then
            echo "Importing configured macOS code signing certificate."
            security create-keychain -p "${MACOS_CODESIGN_KEYCHAIN_PASSWORD}" build-signing.keychain-db
            security set-keychain-settings -lut 21600 build-signing.keychain-db
            security unlock-keychain -p "${MACOS_CODESIGN_KEYCHAIN_PASSWORD}" build-signing.keychain-db
            base64 -D <<< "${MACOS_CODESIGN_CERT_P12_BASE64}" > signing-certificate.p12
            security import signing-certificate.p12 -k build-signing.keychain-db -P "${MACOS_CODESIGN_CERT_PASSWORD}" -T /usr/bin/codesign
            security list-keychains -d user -s build-signing.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_CODESIGN_KEYCHAIN_PASSWORD}" build-signing.keychain-db
            identity=$(security find-identity -v -p codesigning build-signing.keychain-db | awk -F '"' '/"/ { print $2; exit }')
            if [[ -z "${identity}" ]]; then
              echo "::warning::The configured certificate was imported, but it is not a valid code signing identity. Falling back to ad-hoc signing."
              echo "Imported identities:"
              security find-identity -v build-signing.keychain-db || true
              echo "MACOS_CODESIGN_IDENTITY=-" >> "${GITHUB_ENV}"
            else
              echo "MACOS_CODESIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
            fi
          else
            echo "No signing certificate configured; falling back to ad-hoc signing."
            echo "MACOS_CODESIGN_IDENTITY=-" >> "${GITHUB_ENV}"
          fi

      - name: Sign macOS binary
        run: |
          # A self-signed identity does not require an Apple Developer account.
          # It still does not notarize the binary or remove Gatekeeper warnings
          # for downloaded release assets.
          codesign --force --sign "${MACOS_CODESIGN_IDENTITY}" --timestamp=none target/aarch64-apple-darwin/release/pb
          codesign --verify --verbose=4 target/aarch64-apple-darwin/release/pb

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/pb dist/pb-aarch64-apple-darwin

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs['semantic-release'].outputs.new_release_version }}
          files: dist/pb-aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
