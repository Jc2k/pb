<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1d8a7a"/>
      <stop offset="100%" stop-color="#0c4a40"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#5fffd8"/>
      <stop offset="70%" stop-color="#1ecfb0"/>
      <stop offset="100%" stop-color="#0d8a78"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>

  <!-- Radial burst rays (cream/beige) -->
  <g opacity="0.20" fill="#f5e8c8">
    <polygon points="96,55 70,0 96,0"/>
    <polygon points="96,55 35,0 70,0"/>
    <polygon points="96,55 0,30 35,0"/>
    <polygon points="96,55 0,80 0,30"/>
    <polygon points="96,55 0,130 0,80"/>
    <polygon points="96,55 122,0 96,0"/>
    <polygon points="96,55 157,0 122,0"/>
    <polygon points="96,55 192,30 157,0"/>
    <polygon points="96,55 192,80 192,30"/>
    <polygon points="96,55 192,130 192,80"/>
  </g>

  <!-- Antenna stem -->
  <rect x="94" y="32" width="4" height="25" rx="2" fill="#111120"/>
  <!-- Antenna ball glow halo -->
  <circle cx="96" cy="30" r="9" fill="#1ecfb0" opacity="0.3"/>
  <!-- Antenna ball -->
  <circle cx="96" cy="30" r="6" fill="url(#glow)"/>
  <circle cx="94.5" cy="28.5" r="1.5" fill="white" opacity="0.65"/>

  <!-- Lightning bolt left (simplified) -->
  <polygon points="80,14 77,22 82,21 79,30 84,20 79,21" fill="#f5e8c8" opacity="0.9"/>
  <!-- Lightning bolt right -->
  <polygon points="112,12 109,20 114,19 111,28 116,18 111,19" fill="#f5e8c8" opacity="0.9"/>

  <!-- TV monitor body -->
  <rect x="36" y="56" width="120" height="88" rx="12" fill="#111120"/>
  <!-- TV bezel -->
  <rect x="41" y="60" width="110" height="80" rx="9" fill="#e0cfa0"/>
  <!-- TV screen -->
  <rect x="49" y="67" width="94" height="66" rx="5" fill="#080812"/>

  <!-- Left eye (^ pixel shape) -->
  <rect x="62" y="81" width="9" height="7" rx="1.5" fill="#1ecfb0"/>
  <rect x="55" y="88" width="7" height="7" rx="1.5" fill="#1ecfb0"/>
  <rect x="71" y="88" width="7" height="7" rx="1.5" fill="#1ecfb0"/>

  <!-- Right eye (^ pixel shape) -->
  <rect x="121" y="81" width="9" height="7" rx="1.5" fill="#1ecfb0"/>
  <rect x="114" y="88" width="7" height="7" rx="1.5" fill="#1ecfb0"/>
  <rect x="130" y="88" width="7" height="7" rx="1.5" fill="#1ecfb0"/>

  <!-- Grinning pixel mouth - top bar -->
  <rect x="63" y="103" width="66" height="7" rx="2" fill="#1ecfb0"/>
  <!-- bottom bar -->
  <rect x="63" y="110" width="66" height="5" rx="2" fill="#1ecfb0"/>
  <!-- Teeth gaps (dark dividers) -->
  <rect x="71" y="103" width="2" height="12" fill="#080812"/>
  <rect x="80" y="103" width="2" height="12" fill="#080812"/>
  <rect x="89" y="103" width="2" height="12" fill="#080812"/>
  <rect x="98" y="103" width="2" height="12" fill="#080812"/>
  <rect x="107" y="103" width="2" height="12" fill="#080812"/>
  <rect x="116" y="103" width="2" height="12" fill="#080812"/>

  <!-- TV bottom legs/feet (small) -->
  <rect x="70" y="144" width="14" height="6" rx="3" fill="#111120"/>
  <rect x="108" y="144" width="14" height="6" rx="3" fill="#111120"/>
</svg>