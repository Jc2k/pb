name: publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-package.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        shell: bash
        run: |
          echo "manifest=$(jq -c . pb-lsp.json)" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . config-schema.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: pb/rust-analyzer-lsp:test
          build-args: |
            PB_LSP_MANIFEST=${{ steps.metadata.outputs.manifest }}
            PB_CONFIG_SCHEMA=${{ steps.metadata.outputs.schema }}
      - env:
          IMAGE: pb/rust-analyzer-lsp:test
        run: python3 scripts/smoke.py

  publish:
    if: github.event_name == 'push'
    needs: [validate, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crunchy-pb/rust-analyzer-lsp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: metadata
        shell: bash
        run: |
          echo "manifest=$(jq -c . pb-lsp.json)" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . config-schema.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            PB_LSP_MANIFEST=${{ steps.metadata.outputs.manifest }}
            PB_CONFIG_SCHEMA=${{ steps.metadata.outputs.schema }}
          provenance: mode=max
          sbom: true
